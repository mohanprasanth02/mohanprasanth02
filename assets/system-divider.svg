<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 30" width="100%" height="30" style="background: transparent;">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="1"/>
      <stop offset="80%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCenter {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
    }
  </style>

  <!-- Background guide line -->
  <line x1="20" y1="15" x2="900" y2="15" stroke="#00E5FF" stroke-opacity="0.15" stroke-width="1"/>
  
  <!-- Glowing Center Track -->
  <line x1="80" y1="15" x2="840" y2="15" stroke="url(#divGrad)" stroke-width="2" filter="url(#divGlow)"/>

  <!-- Left HUD Marker -->
  <polygon points="120,11 128,15 120,19" fill="#00E5FF"/>
  <rect x="135" y="13" width="4" height="4" fill="#00E5FF"/>
  <rect x="145" y="13" width="4" height="4" fill="#8A2BE2"/>

  <!-- Center HUD Diamond -->
  <g transform="translate(460, 15)">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#05070D" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#8A2BE2"/>
  </g>

  <!-- Right HUD Marker -->
  <rect x="771" y="13" width="4" height="4" fill="#8A2BE2"/>
  <rect x="781" y="13" width="4" height="4" fill="#00E5FF"/>
  <polygon points="800,11 792,15 800,19" fill="#00E5FF"/>
</svg>

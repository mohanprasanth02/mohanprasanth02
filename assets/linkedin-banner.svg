<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Elegant Premium Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="40%" stop-color="#0D1524"/>
      <stop offset="80%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="ambientBlue" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientPurple" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Refined Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Minimal Dot Grid -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.1"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif; }
    .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1584" height="396" fill="url(#bgCanvas)"/>
  <rect width="1584" height="396" fill="url(#dotGrid)"/>
  <rect width="1584" height="396" fill="url(#ambientBlue)"/>
  <rect width="1584" height="396" fill="url(#ambientPurple)"/>

  <!-- Subtle Elegant Border -->
  <rect x="1" y="1" width="1582" height="394" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>

  <!-- ── RIGHT SIDE: MINIMALIST NEURAL DATA ARCHITECTURE ── -->
  <g transform="translate(1260, 198)">
    <!-- Concentric Soft Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#6366F1" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.2"/>
    
    <!-- Central Glass Core -->
    <circle cx="0" cy="0" r="42" fill="#0D1524" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Neural Links -->
    <g stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2">
      <line x1="-22" y1="-16" x2="0" y2="0"/>
      <line x1="-22" y1="16" x2="0" y2="0"/>
      <line x1="22" y1="-16" x2="0" y2="0"/>
      <line x1="22" y1="16" x2="0" y2="0"/>
      <line x1="0" y1="-26" x2="0" y2="0"/>
      <line x1="0" y1="26" x2="0" y2="0"/>
    </g>

    <!-- Node Points -->
    <circle cx="-22" cy="-16" r="3.5" fill="#38BDF8"/>
    <circle cx="-22" cy="16" r="3.5" fill="#818CF8"/>
    <circle cx="22" cy="-16" r="3.5" fill="#818CF8"/>
    <circle cx="22" cy="16" r="3.5" fill="#38BDF8"/>
    <circle cx="0" cy="-26" r="3" fill="#38BDF8"/>
    <circle cx="0" cy="26" r="3" fill="#A855F7"/>

    <!-- Center Core Point -->
    <circle cx="0" cy="0" r="7" fill="#38BDF8" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Ambient Wave Lines in Background -->
  <g opacity="0.15" stroke="url(#accentLine)" stroke-width="1.2" fill="none">
    <path d="M 850 350 Q 1050 200 1250 280 T 1550 120"/>
    <path d="M 800 380 Q 1000 240 1200 310 T 1550 160"/>
  </g>

  <!-- ── MAIN CONTENT (Positioned with safe clearance for left profile picture) ── -->
  <g transform="translate(360, 80)">
    
    <!-- Top Professional Badge -->
    <rect x="0" y="0" width="210" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" class="sans" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="0.8">
      AI &amp; ML DEVELOPER
    </text>

    <!-- Name Heading -->
    <text x="0" y="74" class="sans" font-size="44" font-weight="800" fill="url(#nameGrad)" letter-spacing="0.5">
      Mohan Prasanth K
    </text>

    <!-- Subtitle / Role -->
    <text x="2" y="108" class="sans" font-size="19" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Artificial Intelligence &amp; Machine Learning <tspan fill="#38BDF8">·</tspan> Full-Stack Engineer
    </text>

    <!-- Clean Tech Domain Pills -->
    <g transform="translate(0, 134)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="136" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="19" class="sans" font-size="12" font-weight="500" fill="#CBD5E1">Computer Vision</text>

      <!-- Pill 2 -->
      <rect x="146" y="0" width="124" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="160" y="19" class="sans" font-size="12" font-weight="500" fill="#CBD5E1">Deep Learning</text>

      <!-- Pill 3 -->
      <rect x="280" y="0" width="128" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="294" y="19" class="sans" font-size="12" font-weight="500" fill="#CBD5E1">Cybersecurity</text>

      <!-- Pill 4 -->
      <rect x="418" y="0" width="158" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="432" y="19" class="sans" font-size="12" font-weight="500" fill="#CBD5E1">Cloud &amp; Full-Stack</text>
    </g>

    <!-- Clean Horizontal Divider -->
    <line x1="0" y1="184" x2="680" y2="184" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

    <!-- Contact & Details Footer Row -->
    <g transform="translate(0, 214)" class="sans" font-size="12.5" fill="#94A3B8">
      <!-- Portfolio -->
      <g transform="translate(0, 0)">
        <text fill="#38BDF8" font-weight="600">🌐</text>
        <text x="18" y="0" fill="#E2E8F0" font-weight="500">mohan-mp.vercel.app</text>
      </g>

      <!-- Email -->
      <g transform="translate(210, 0)">
        <text fill="#818CF8" font-weight="600">✉️</text>
        <text x="18" y="0" fill="#E2E8F0" font-weight="500">mohanprasanth02@gmail.com</text>
      </g>

      <!-- Location -->
      <g transform="translate(460, 0)">
        <text fill="#38BDF8" font-weight="600">📍</text>
        <text x="18" y="0" fill="#E2E8F0" font-weight="500">Coimbatore, India</text>
      </g>
    </g>
  </g>

  <!-- Right Side Stat Summary Cards (Clean & Decent) -->
  <g transform="translate(1080, 88)">
    <rect x="0" y="0" width="130" height="62" rx="8" fill="#0D1524" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="28" class="sans" font-size="20" font-weight="800" fill="#38BDF8">10+</text>
    <text x="16" y="48" class="sans" font-size="10.5" font-weight="500" fill="#94A3B8">AI Projects</text>

    <rect x="0" y="74" width="130" height="62" rx="8" fill="#0D1524" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="102" class="sans" font-size="20" font-weight="800" fill="#818CF8">12+ Mos</text>
    <text x="16" y="122" class="sans" font-size="10.5" font-weight="500" fill="#94A3B8">Experience</text>

    <rect x="0" y="148" width="130" height="62" rx="8" fill="#0D1524" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="176" class="sans" font-size="18" font-weight="800" fill="#38BDF8">AWS</text>
    <text x="16" y="196" class="sans" font-size="10.5" font-weight="500" fill="#94A3B8">Cloud Intern</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#07111D"/>
      <stop offset="100%" stop-color="#0A0F18"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="cyanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseActive {
      0%, 100% { fill: #00E5FF; opacity: 1; filter: drop-shadow(0 0 4px #00E5FF); }
      50% { fill: #00E5FF; opacity: 0.3; filter: none; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .mono { font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace; }
    .term-cursor { animation: termBlink 1s infinite; }
    .active-dot { animation: pulseActive 2s infinite ease-in-out; }
  </style>

  <!-- Frame Base -->
  <rect x="2" y="2" width="916" height="276" rx="10" fill="url(#termBg)" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Terminal Header Bar -->
  <rect x="2" y="2" width="916" height="34" rx="10" fill="#0A0F18" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="18" r="5" fill="#FF006E" opacity="0.8"/>
  <circle cx="42" cy="18" r="5" fill="#8A2BE2" opacity="0.8"/>
  <circle cx="60" cy="18" r="5" fill="#00E5FF" opacity="0.8"/>
  
  <text x="90" y="22" class="mono" font-size="11" fill="#B8C7D9" font-weight="600" letter-spacing="1">
    TERMINAL // SYS_DIAGNOSTICS :: CORE_SUBSYSTEMS_RUNNING
  </text>
  <text x="750" y="22" class="mono" font-size="10" fill="#00E5FF" font-weight="700">
    STATUS: [ OPERATIONAL ]
  </text>

  <!-- Diagnostic Matrix Columns -->
  <!-- Header row inside terminal -->
  <g transform="translate(24, 60)" class="mono" font-size="10" fill="#8A2BE2" font-weight="700">
    <text x="0" y="0">MODULE ID</text>
    <text x="140" y="0">SUBSYSTEM IDENTITY</text>
    <text x="440" y="0">STACK / RUNTIME</text>
    <text x="680" y="0">INTEGRITY</text>
    <text x="790" y="0">STATE</text>
    <line x1="0" y1="8" x2="868" y2="8" stroke="#8A2BE2" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Row 1: AI / ML -->
  <g transform="translate(24, 94)" class="mono">
    <rect x="0" y="-14" width="868" height="26" rx="4" fill="#07111D" fill-opacity="0.6"/>
    <text x="10" y="3" font-size="11" fill="#B8C7D9">MOD_0x01</text>
    <text x="140" y="3" font-size="11" fill="#FFFFFF" font-weight="600">AI / MACHINE LEARNING</text>
    <text x="440" y="3" font-size="11" fill="#B8C7D9">Python · Scikit-Learn · Pandas · NumPy</text>
    <text x="680" y="3" font-size="11" fill="#00E5FF">99.8% OK</text>
    <circle cx="796" cy="0" r="4" class="active-dot"/>
    <text x="808" y="3" font-size="11" fill="#00E5FF" font-weight="700">ACTIVE</text>
  </g>

  <!-- Row 2: Computer Vision -->
  <g transform="translate(24, 126)" class="mono">
    <rect x="0" y="-14" width="868" height="26" rx="4" fill="#07111D" fill-opacity="0.3"/>
    <text x="10" y="3" font-size="11" fill="#B8C7D9">MOD_0x02</text>
    <text x="140" y="3" font-size="11" fill="#FFFFFF" font-weight="600">COMPUTER VISION</text>
    <text x="440" y="3" font-size="11" fill="#B8C7D9">OpenCV · MediaPipe · CNN · YOLO · FaceNet</text>
    <text x="680" y="3" font-size="11" fill="#00E5FF">99.5% OK</text>
    <circle cx="796" cy="0" r="4" class="active-dot"/>
    <text x="808" y="3" font-size="11" fill="#00E5FF" font-weight="700">ACTIVE</text>
  </g>

  <!-- Row 3: Full-Stack Development -->
  <g transform="translate(24, 158)" class="mono">
    <rect x="0" y="-14" width="868" height="26" rx="4" fill="#07111D" fill-opacity="0.6"/>
    <text x="10" y="3" font-size="11" fill="#B8C7D9">MOD_0x03</text>
    <text x="140" y="3" font-size="11" fill="#FFFFFF" font-weight="600">FULL-STACK WEB DEV</text>
    <text x="440" y="3" font-size="11" fill="#B8C7D9">Flask · REST APIs · SQLite · SQL · HTML5/JS</text>
    <text x="680" y="3" font-size="11" fill="#00E5FF">100.0% OK</text>
    <circle cx="796" cy="0" r="4" class="active-dot"/>
    <text x="808" y="3" font-size="11" fill="#00E5FF" font-weight="700">ACTIVE</text>
  </g>

  <!-- Row 4: Cybersecurity -->
  <g transform="translate(24, 190)" class="mono">
    <rect x="0" y="-14" width="868" height="26" rx="4" fill="#07111D" fill-opacity="0.3"/>
    <text x="10" y="3" font-size="11" fill="#B8C7D9">MOD_0x04</text>
    <text x="140" y="3" font-size="11" fill="#FFFFFF" font-weight="600">CYBERSECURITY &amp; NIDS</text>
    <text x="440" y="3" font-size="11" fill="#B8C7D9">SNORT NIDS · MFA · TOTP · Threat Detection</text>
    <text x="680" y="3" font-size="11" fill="#00E5FF">99.9% OK</text>
    <circle cx="796" cy="0" r="4" class="active-dot"/>
    <text x="808" y="3" font-size="11" fill="#00E5FF" font-weight="700">ACTIVE</text>
  </g>

  <!-- Row 5: Cloud / AWS -->
  <g transform="translate(24, 222)" class="mono">
    <rect x="0" y="-14" width="868" height="26" rx="4" fill="#07111D" fill-opacity="0.6"/>
    <text x="10" y="3" font-size="11" fill="#B8C7D9">MOD_0x05</text>
    <text x="140" y="3" font-size="11" fill="#FFFFFF" font-weight="600">CLOUD &amp; ANALYTICS</text>
    <text x="440" y="3" font-size="11" fill="#B8C7D9">AWS Cloud (EC2, S3, IAM) · Power BI · Tableau</text>
    <text x="680" y="3" font-size="11" fill="#00E5FF">99.4% OK</text>
    <circle cx="796" cy="0" r="4" class="active-dot"/>
    <text x="808" y="3" font-size="11" fill="#00E5FF" font-weight="700">ACTIVE</text>
  </g>

  <!-- Prompt Command Line at Bottom -->
  <g transform="translate(24, 258)" class="mono" font-size="11">
    <text x="10" y="0" fill="#00E5FF" font-weight="700">mohan@ai-command:~$</text>
    <text x="180" y="0" fill="#FFFFFF">sysctl --inspect-models --verify-integrity</text>
    <rect x="495" y="-10" width="8" height="13" fill="#00E5FF" class="term-cursor"/>
  </g>
</svg>
